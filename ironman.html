<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iron Man | Proof That We Have A Heart</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <a href="index.html" class="back-btn">← Back to Multiverse Hub</a>
    <h1 class="title-glow" style="background: linear-gradient(135deg, #ffd700, #e50914); -webkit-background-clip: text;">STARK ARCHIVE LOG</h1>
    <p class="subtitle">Core Energy Level: Friendship Arc Reactor</p>
  </header>

  <main class="content-container ironman-theme">
    <p style="font-size: 0.9rem; color: #8b949e;">Tap the Arc Reactor to Charge Friendship Energy (+1000% per click)!</p>

    <div class="arc-reactor" id="arcReactor" onclick="chargeReactor()">
      <div class="arc-inner" id="reactorText">0%</div>
    </div>

    <div class="jarvis-box" id="jarvisBox">
      <p><strong>JARVIS Diagnostic:</strong> Arc Reactor Offline. Tap above to boost power level!</p>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script>
    let starkPower = 0;

    function chargeReactor() {
      audio.playIronMan();

      if (starkPower < 3000) {
        starkPower += 1000;
        document.getElementById('reactorText').innerText = starkPower + "%";

        if (starkPower === 1000) {
          document.getElementById('jarvisBox').innerHTML = `<p><strong>JARVIS Status:</strong> Initializing core protocols... Coffee and jokes loaded!</p>`;
        } else if (starkPower === 2000) {
          document.getElementById('jarvisBox').innerHTML = `<p><strong>JARVIS Status:</strong> Repulsors charging... Forgiveness levels rising fast!</p>`;
        } else if (starkPower === 3000) {
          document.getElementById('arcReactor').classList.add('max-power');
          document.getElementById('jarvisBox').style.borderColor = "var(--ironman-gold)";
          document.getElementById('jarvisBox').innerHTML = `
            <div style="color: var(--ironman-gold);">
              <h3>🎉 MAXIMUM POWER LEVEL REACHED!</h3>
              <p><strong>"Proof That We Have A Heart."</strong></p>
              <p style="margin-top:0.5rem;">I love you 3000 bestie! System status: Unbreakable Friendship online!</p>
            </div>
          `;
        }
      } else {
        alert("JARVIS: Core energy at absolute maximum (3000%). Love you 3000!");
      }
    }
  </script>
</body>
</html>
